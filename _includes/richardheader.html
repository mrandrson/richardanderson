<header class="site-header" role="banner">
  <div class="wrapper">
    {%- assign default_paths = site.pages | map: "path" -%}
    {%- assign page_paths = site.header_pages | default: default_paths -%}
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

    {%- if page_paths -%}
      <nav class="site-nav" style="position: relative;">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon">
            <svg viewBox="0 0 18 15" width="18px" height="15px">
              <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
            </svg>
          </span>
        </label>

        <div class="trigger">
          <!-- Dropdown for Research -->
          <div style="position: relative; display: inline-block;">
            <button style="background: none; border: none; color: white; font-size: 16px; cursor: pointer;">
              Research ▼
            </button>
            <div class="dropdown" style="display: none; position: absolute; top: 100%; left: 0; background-color: white; color: black; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); z-index: 1000; min-width: 300px;">
              <a href="{{ '/pproject/' | relative_url }}" style="display: block; padding: 10px; text-decoration: none; color: black;">Planetesimal Project</a>
              <a href="{{ '/nextdataanalysis/' | relative_url }}" style="display: block; padding: 10px; text-decoration: none; color: black;">NEXT Data Analysis</a>
              <a href="{{ '/missilesystems/' | relative_url }}" style="display: block; padding: 10px; text-decoration: none; color: black;">Missile Systems Design</a>
            </div>
          </div>

          <!-- Dropdown for Other Projects -->
          <div style="position: relative; display: inline-block;">
            <button style="background: none; border: none; color: white; font-size: 16px; cursor: pointer;">
              Other Projects ▼
            </button>
            <div class="dropdown" style="display: none; position: absolute; top: 100%; left: 0; background-color: white; color: black; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); z-index: 1000; min-width: 300px;">
              <a href="{{ '/personalprojects/' | relative_url }}" style="display: block; padding: 10px; text-decoration: none; color: black;">Personal Projects</a>
            </div>
          </div>
        </div>
      </nav>
    {%- endif -%}
  </div>
</header>

<script>
  // Show dropdown on hover
  document.querySelectorAll('.site-nav div').forEach(item => {
    item.addEventListener('mouseenter', () => {
      const dropdown = item.querySelector('.dropdown');
      if (dropdown) dropdown.style.display = 'block';
    });
    item.addEventListener('mouseleave', () => {
      const dropdown = item.querySelector('.dropdown');
      if (dropdown) dropdown.style.display = 'none';
    });
  });
</script>
