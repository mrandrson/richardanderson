<header class="site-header" style="background-color: #222; border-bottom: 1px solid #444; padding: 15px 0;">
  <div class="wrapper" style="display: flex; justify-content: space-between; align-items: center;">

    <a class="site-title" href="{{ "/" | relative_url }}" style="color: #ffffff; font-size: 24px;">
      {{ site.title }}
    </a>
    
    <!--
    Old
    <nav class="site-nav" style="display: flex; gap: 30px; position: relative;">
    -->
    <nav class="site-nav" style="margin-left: auto; display: flex; gap: 30px; position: relative;">
      <!-- Research Dropdown -->
      <div class="dropdown" style="position: relative;">
        <a href="#" style="color: #ffffff; text-decoration: none;">Research &#9207;</a>
        <div class="dropdown-content" style="display: none; position: absolute; top: 100%; left: 0; background-color: white; border: 1px solid #ccc; padding: 10px 0; min-width: 200px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
          <a href="{{ '/pproject/' | relative_url }}" style="display: block; padding: 10px 20px; color: #333; text-decoration: none;">Planetesimal Project</a>
          <a href="{{ '/nextdataanalysis/' | relative_url }}" style="display: block; padding: 10px 20px; color: #333; text-decoration: none;">NEXT Data Analysis</a>
          <a href="{{ '/missilesystems/' | relative_url }}" style="display: block; padding: 10px 20px; color: #333; text-decoration: none;">Missile Systems Design</a>
        </div>
      </div>

      <!-- Personal Projects Dropdown -->
      <div class="dropdown" style="position: relative;">
        <a href="#" style="color: #ffffff; text-decoration: none;">Personal Projects &#9207;</a>
        <div class="dropdown-content" style="display: none; position: absolute; top: 100%; left: 0; background-color: white; border: 1px solid #ccc; padding: 10px 0; min-width: 200px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
          <a href="{{ '/personalprojects/' | relative_url }}" style="display: block; padding: 10px 20px; color: #333; text-decoration: none;">Personal Projects</a>
        </div>
      </div>
    </nav>

  </div>
</header>

<script>
  document.querySelectorAll('.dropdown').forEach(drop => {
    drop.addEventListener('mouseenter', () => {
      const content = drop.querySelector('.dropdown-content');
      if (content) content.style.display = 'block';
    });
    drop.addEventListener('mouseleave', () => {
      const content = drop.querySelector('.dropdown-content');
      if (content) content.style.display = 'none';
    });
  });
</script>
